name: Star History

on:
  schedule:
    - cron: '0 0 * * 0'  # weekly, Sunday midnight UTC
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: narayann7/star-history-action@v1
        with:
          repos: ${{ github.repository }}
